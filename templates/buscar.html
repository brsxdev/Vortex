<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex-Commerce</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        /* Scrollbar personalizado global (para todo el HTML) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0b0b;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff6600;
        }
        /* Scrollbars personalizados para las secciones de productos */
        .products-scroll-container::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .products-scroll-container::-webkit-scrollbar-track {
            background: #121212;
            border-radius: 10px;
        }
        .products-scroll-container::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 10px;
        }
        .products-scroll-container::-webkit-scrollbar-thumb:hover {
            background: #ff6600;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            scrollbar-color: #2a2a2a #0b0b0b;
            scrollbar-width: thin;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Estilo para la barra superior que contiene el botón Volver */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }

        .back-button {
            background-color: rgba(18, 18, 18, 0.85);
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .back-button:hover {
            border-color: #ff6600;
            background-color: #1a1a1a;
            color: #ff6600;
        }

        .search-container {
            position: relative;
            width: 100%;
            display: flex;
            gap: 10px;
            background-color: #141414;
            border: 1px solid #222;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .search-input-wrapper {
            position: relative;
            flex: 1;
        }
        .search-input {
            width: 100%;
            padding: 14px 20px;
            padding-right: 55px;
            background-color: rgba(18, 18, 18, 0.85);
            border: 1px solid #333333;
            border-radius: 30px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: #ff6600;
        }
        .search-input::placeholder {
            color: #777777;
        }
        .search-icon {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #1d1c1c;
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .search-icon:hover {
            background-color: #3c3b3b;
            transform: translateY(-50%) scale(1.05);
        }
        .category-select {
            padding: 0 20px;
            background-color: rgba(18, 18, 18, 0.85);
            border: 1px solid #333333;
            border-radius: 30px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .category-select:focus {
            border-color: #ff6600;
        }
        .category-select option {
            background-color: #121212;
            color: #ffffff;
        }
        /* Contenedor con scroll vertical y grid de 4 columnas */
        .products-scroll-container {
            background-color: #141414;
            border: 1px solid #222;
            border-radius: 12px;
            max-height: 70vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            flex: 1;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
        }
        /* Tarjeta de producto profesional */
        .product-card {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: #ff6600;
        }
        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #1e1e1e;
            overflow: hidden;
        }
        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .product-card:hover .product-img-wrapper img {
            transform: scale(1.05);
        }
        .product-category-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            color: #ffb74d;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .product-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }
        .product-name { 
            font-size: 14px; 
            font-weight: 600; 
            color: #ffffff; 
            margin-bottom: 6px; 
            display: -webkit-box; 
            -webkit-box-orient: vertical; 
            -webkit-line-clamp: 2; 
            line-clamp: 2; 
            overflow: hidden; 
        }
        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }
        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }
        .add-to-cart-btn {
            background-color: #ff6600;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add-to-cart-btn:hover {
            background-color: #e05b00;
        }
        @media (max-width: 1200px) {
            .products-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        @media (max-width: 900px) {
            .products-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .search-container {
                flex-direction: column;
            }
        }
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .products-grid {
                grid-template-columns: repeat(1, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="back-button" id="regreso">← Volver</button>
    </div>

    <div class="search-container">
        <select class="category-select" id="selectctg">
            <option value="todo">Todas las categorías</option>
        </select>
        <div class="search-input-wrapper">
            <input type="text" class="search-input" id="inpt-buscar" placeholder="Buscar productos por coincidencia o nombre(Se mostraran los primeros 20)">
            <button type="button" class="search-icon" id="bton-buscar">🔍</button>
        </div>
    </div>


    <div class="products-scroll-container">
        <div class="products-grid" id="catalogoscroll">
        </div>
    </div>
</body>
<script>
    const listaJSON = sessionStorage.getItem("ProductosEncontrados")
    const inpt_buscar = document.getElementById("inpt-buscar")
    const selectcategoria = document.getElementById("selectctg")
    const bton_buscar = document.getElementById("bton-buscar")
    const valores = localStorage.getItem("ProductosAñadidos")
    let numero = 0
    document.getElementById("regreso").addEventListener("click",()=>{
        window.location.replace("/")
    })

    if (valores){
        let lista = JSON.parse(valores)
        if (lista.length > 0){
            document.title = `Carrito(${lista.length})-Vortex Commerce`
            numero = lista.length
        }
    }
    if (listaJSON){
        const listaJS = JSON.parse(listaJSON)
        let html = ""
        sessionStorage.removeItem("ProductosEncontrados")
        for (let elemento of listaJS){
        if (Number(elemento[4]) > 0){
            html += ` <div class="product-card">
                <div class="product-img-wrapper">
                    <span class="product-category-label">${elemento[5]}</span>
                    <img src="${elemento[3]}">
                </div>
                <div class="product-info">
                    <h3 class="product-name">${elemento[1]}</h3>
                    <div class="product-footer">
                        <span class="product-price">S/${elemento[6]}</span>
                        <button class="add-to-cart-btn" id="producto-${elemento[0]}">Añadir</button>
                    </div>
                </div>
            </div>`
        }
        }
        document.getElementById("catalogoscroll").innerHTML = html
        for (let elemento of listaJS){
            if (Number(elemento[4]) > 0){
                let presionado = false
            if (valores){
                lista = JSON.parse(valores)
                console.log(lista)
                let encontrado = false
                for (let elemento2 of lista){
                    if (Number(elemento2.id) === Number(elemento[0])){
                        encontrado = true
                    }
                }

                if (encontrado === true){
                    presionado = true
                    document.getElementById(`producto-${elemento[0]}`).style.backgroundColor = "rgb(34, 139, 34)"
                    document.getElementById(`producto-${elemento[0]}`).textContent = "Añadido"
                }
            }
            document.getElementById(`producto-${elemento[0]}`).addEventListener("click",()=>{
                    if (presionado === false){
                        presionado = true
                        document.getElementById(`producto-${elemento[0]}`).style.backgroundColor = "rgb(34, 139, 34)"
                    document.getElementById(`producto-${elemento[0]}`).textContent = "Añadido"
                    let productos = JSON.parse(localStorage.getItem("ProductosAñadidos")) || []
                    productos.push({id: elemento[0]})
                    localStorage.setItem("ProductosAñadidos", JSON.stringify(productos))
                    numero += 1
                    document.title = `Carrito(${numero})-Vortex Commerce`
                    }

                })
            }
        }

        
    }

    fetch("/obtenercategorias",{method:"POST"})
    .then(res=>res.json())
    .then(rptacategorias=>{
        for (elemento of rptacategorias){
            document.getElementById("selectctg").innerHTML += `<option value="${elemento[0]}">${elemento[0]}</option> `
        }
    })

    bton_buscar.addEventListener("click",()=>{
        if (inpt_buscar.value.trim()!==""){
            fetch("/obtener-busqueda",{method:"POST", headers:{"Content-Type": "application/json"}, body:JSON.stringify({dato:inpt_buscar.value.trim(), categoria:selectcategoria.value})})
            .then(res=>res.json())
            .then(rpta_busqueda=>{
                if (rpta_busqueda.exito === true){
                    document.getElementById("catalogoscroll").innerHTML = ""
                    let html = ""
                    for (let elemento of rpta_busqueda.lista){
        if (Number(elemento[4]) > 0){
            html += ` <div class="product-card">
                <div class="product-img-wrapper">
                    <span class="product-category-label">${elemento[5]}</span>
                    <img src="${elemento[3]}">
                </div>
                <div class="product-info">
                    <h3 class="product-name">${elemento[1]}</h3>
                    <div class="product-footer">
                        <span class="product-price">S/${elemento[6]}</span>
                        <button class="add-to-cart-btn"  id="producto-${elemento[0]}">Añadir</button>
                    </div>
                </div>
            </div>`
        }
        }
        document.getElementById("catalogoscroll").innerHTML = html
                for (let elemento of rpta_busqueda.lista){
            if (Number(elemento[4]) > 0){
                let presionado = false
            if (valores){
                lista = JSON.parse(valores)
                console.log(lista)
                let encontrado = false
                for (let elemento2 of lista){
                    if (Number(elemento2.id) === Number(elemento[0])){
                        encontrado = true
                    }
                }

                if (encontrado === true){
                    presionado = true
                    document.getElementById(`producto-${elemento[0]}`).style.backgroundColor = "rgb(34, 139, 34)"
                    document.getElementById(`producto-${elemento[0]}`).textContent = "Añadido"
                }
            }
            document.getElementById(`producto-${elemento[0]}`).addEventListener("click",()=>{
                    if (presionado === false){
                        presionado = true
                        document.getElementById(`producto-${elemento[0]}`).style.backgroundColor = "rgb(34, 139, 34)"
                    document.getElementById(`producto-${elemento[0]}`).textContent = "Añadido"
                    let productos = JSON.parse(localStorage.getItem("ProductosAñadidos")) || []
                    productos.push({id: elemento[0]})
                    localStorage.setItem("ProductosAñadidos", JSON.stringify(productos))
                    numero += 1
                    document.title = `Carrito(${numero})-Vortex Commerce`
                    }

                })
            }
        }
                } else{
                    inpt_buscar.style.color = "red"
                    inpt_buscar.value = `No se encontro un producto con '${inpt_buscar.value}'`
                    setTimeout(()=>{
                        inpt_buscar.style.color = "white"
                        inpt_buscar.value = ``
                    },1200)
                }
            })
        }
    })
</script>
</html>
